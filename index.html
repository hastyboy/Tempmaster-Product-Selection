<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TempMaster Solution Navigator Helper</title>
  <style>
    :root{
      --bg:#0b0f14; --panel:#111827; --panel2:#0f172a; --text:#e5e7eb;
      --muted:#9ca3af; --accent:#60a5fa; --good:#34d399; --warn:#fbbf24; --bad:#f87171;
      --border:#1f2937;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif;
    }
    body{margin:0;background:var(--bg);color:var(--text);}
    header{
      padding:14px 18px;border-bottom:1px solid var(--border);
      background:linear-gradient(180deg,#0b0f14,#0b0f14 60%,#0a0d12);
      position:sticky;top:0;z-index:10;
      display:flex;gap:12px;align-items:center;justify-content:space-between;
    }
    header h1{margin:0;font-size:18px;letter-spacing:.3px;}
    main{display:grid;grid-template-columns: 1.1fr .9fr; gap:14px; padding:14px;}
    .card{
      background:var(--panel);border:1px solid var(--border);border-radius:14px;
      padding:12px;box-shadow:0 6px 18px rgba(0,0,0,.35);
    }
    .card h2{margin:0 0 8px 0;font-size:14px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;}
    textarea{
      width:100%;min-height:220px;resize:vertical;
      background:#06080c;color:var(--text);
      border:1px solid var(--border);border-radius:10px;padding:10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size:13px;line-height:1.45;
    }
    .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
    button{
      background:var(--panel2);color:var(--text);border:1px solid var(--border);
      padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600;
    }
    button.primary{background:var(--accent);color:#031024;border:none;}
    button.ghost{background:transparent;}
    .small{font-size:12px;color:var(--muted);}
    pre{
      background:#05070a;border:1px dashed var(--border);
      padding:10px;border-radius:10px;white-space:pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size:13px;line-height:1.45;
    }
    .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;margin-left:6px;}
    .pill.good{background:rgba(52,211,153,.15);color:var(--good);border:1px solid rgba(52,211,153,.3);}
    .pill.warn{background:rgba(251,191,36,.12);color:var(--warn);border:1px solid rgba(251,191,36,.25);}
    .pill.bad{background:rgba(248,113,113,.12);color:var(--bad);border:1px solid rgba(248,113,113,.25);}
    code{color:#cbd5e1;}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  </style>
</head>

<body>
<header>
  <h1>TempMaster SN Helper — Omni Pro Engine</h1>
  <div class="small">Input format A (strict) → Full Model + SN Required Checklist</div>
</header>

<main>
  <!-- INPUT -->
  <section class="card">
    <h2>1) Input Schedule (Compact Line Codes)</h2>
    <div class="small">
      Paste one unit per line using <b>pipe-d
